[package]
name = "fastman-desktop"
description = "Native, local-first API development client built with Rust and GPUI Kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fastman-core = { path = "../../crates/fastman-core" }
gpui-kit = "=0.10.0"
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }

[dev-dependencies]
# Match GPUI Kit's backend; enable only GPUI's headless test support.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["test-support"] }
tempfile.workspace = true
