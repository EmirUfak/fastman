[package]
name = "fastman-core"
description = "Core domain model, local storage, Postman v2.1 importer, and HTTP engine for Fastman"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
dirs = "7.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "gzip", "brotli", "deflate", "stream", "form", "query", "http2", "system-proxy"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tempfile = "3"
