[package]
name = "fastman-core"
description = "Core domain model, local storage, Collection v2.1 importer, and HTTP engine for Fastman"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "form", "http2", "system-proxy", "cookies"] }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tempfile.workspace = true
