name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-windows:
    name: Package Windows x86_64
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt-check
      - name: Clippy workspace
        run: cargo lint-all
      - name: Test workspace
        run: cargo test-all
      - name: Build release binaries
        run: cargo build --release --locked --workspace
      - name: Verify tag matches CLI version
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $cliOutput = & target/release/fastman-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cliVersion = ($cliOutput -replace '^fastman-cli\s+', '').Trim()
          if ($cliVersion -ne $tagVersion) {
            throw "Tag version ($tagVersion) does not match fastman-cli --version ($cliVersion)"
          }
      - name: Package Windows archive and checksum
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "fastman-$tag-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force -Path dist/stage, dist | Out-Null
          Copy-Item -Path @(
            "target/release/fastman-desktop.exe",
            "target/release/fastman-cli.exe",
            "LICENSE",
            "README.md"
          ) -Destination dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -FilePath "dist/$archive.sha256" -Encoding ascii
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "fastman-$tag-x86_64-pc-windows-msvc.zip"
          $ghArgs = @(
            "release", "create", $tag,
            "dist/$archive",
            "dist/$archive.sha256",
            "--title", "Fastman $tag",
            "--generate-notes"
          )
          if ($tag -match '-') {
            $ghArgs += "--prerelease"
          }
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
