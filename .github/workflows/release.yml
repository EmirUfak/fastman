name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-windows:
    name: Package Windows x86_64
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "windows-x86_64"
          cache-on-failure: true
      - name: Format
        run: cargo fmt-check
      - name: Clippy workspace
        run: cargo lint-all
      - name: Test workspace
        run: cargo test-all
      - name: Build desktop release binary
        run: cargo build --release --locked -p fastman-desktop
      - name: Verify tag matches desktop version
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $desktopPkg = $meta.packages | Where-Object { $_.name -eq 'fastman-desktop' } | Select-Object -First 1
          if (-not $desktopPkg) {
            throw "fastman-desktop package not found in cargo metadata"
          }
          if ($desktopPkg.version -ne $tagVersion) {
            throw "Tag version ($tagVersion) does not match fastman-desktop version ($($desktopPkg.version))"
          }
      - name: Package desktop binary and checksum
        run: |
          $tag = "${{ github.ref_name }}"
          $exeName = "fastman-desktop-$tag-windows-x86_64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "target/release/fastman-desktop.exe" -Destination "dist/$exeName" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$exeName").Hash.ToLowerInvariant()
          "$hash  $exeName" | Out-File -FilePath "dist/$exeName.sha256" -Encoding ascii
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag -replace '^v', ''
          $exeName = "fastman-desktop-$tag-windows-x86_64.exe"
          $hash = (Get-Content "dist/$exeName.sha256" -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].Trim()
          $notesFile = "dist/release-notes.md"
          $hasNotes = $false
          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md" -Encoding utf8
            $escaped = [regex]::Escape($tagVersion)
            $inSection = $false
            $section = [System.Collections.Generic.List[string]]::new()
            $compareUrl = $null
            foreach ($line in $lines) {
              if (-not $inSection) {
                if ($line -match "^## \[$escaped\](?:\s|$)") {
                  $inSection = $true
                }
                continue
              }
              if ($line -match '^## \[' -or $line -match '^\[[^\]]+\]:\s') {
                break
              }
              $section.Add($line)
            }
            foreach ($line in $lines) {
              if ($line -match "^\[$escaped\]:\s+(\S+)") {
                $compareUrl = $Matches[1]
                break
              }
            }
            $body = ($section -join "`n").Trim()
            if ($body) {
              $notes = @(
                $body,
                "",
                "### Windows Binary",
                "Unsigned portable Windows x86_64 executable (Windows SmartScreen may warn on first run).",
                "",
                "- ``$exeName`` — SHA-256: ``$hash``"
              )
              if ($compareUrl) {
                $notes += ""
                $notes += "**Full Changelog**: $compareUrl"
              }
              ($notes -join "`n") | Out-File -FilePath $notesFile -Encoding utf8
              $hasNotes = $true
            }
          }
          $ErrorActionPreference = "Continue"
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag "dist/$exeName" "dist/$exeName.sha256" --clobber
          } else {
            $ghArgs = @(
              "release", "create", $tag,
              "dist/$exeName",
              "dist/$exeName.sha256",
              "--title", "Fastman $tag"
            )
            if ($hasNotes) {
              $ghArgs += @("--notes-file", $notesFile)
            } else {
              $ghArgs += "--generate-notes"
            }
            if ($tag -match '-') {
              $ghArgs += "--prerelease"
            }
            & gh @ghArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
