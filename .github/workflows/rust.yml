name: Rust checks
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test headless core
        run: cargo test --locked -p fastman-core -p fastman-cli
      - name: Clippy headless core
        run: cargo clippy --locked -p fastman-core -p fastman-cli --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --locked --workspace
