name: Rust checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/release.yml"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/release.yml"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "windows-x86_64"
          cache-on-failure: true
      - name: Format
        run: cargo fmt-check
      - name: Verify core stays GUI-free
        run: |
          $tree = cargo tree -p fastman-core --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tree | Select-String -Pattern '\bgpui' -Quiet) {
            throw 'fastman-core must remain GUI-free (found gpui dependency)'
          }
      - name: Clippy workspace
        run: cargo lint-all
      - name: Test workspace
        run: cargo test-all
      - name: Release build workspace
        if: github.event_name != 'pull_request'
        run: cargo build --release --locked --workspace
      - name: Upload Windows executables
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastman-windows-x86_64
          path: |
            target/release/fastman-desktop.exe
            target/release/fastman-cli.exe
          retention-days: 14
          if-no-files-found: error

  msrv:
    name: MSRV (Rust 1.100)
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Overrides rust-toolchain.toml (stable) so the declared rust-version is actually built.
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check workspace on MSRV
        run: cargo check-all

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock
        run: cargo audit
